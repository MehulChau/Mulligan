<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d3b25" />
    <meta name="color-scheme" content="light dark" />
    <!-- Mobile app affordances: this is meant to be played full-screen from
         the home screen, not browsed as a document. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mulligan" />
    <meta name="format-detection" content="telephone=no" />
    <title>Mulligan</title>
    <!-- vite-plugin-pwa injects <link rel="manifest"> and registers the
         service worker at build time; the apple-touch-icon isn't part of
         the web manifest spec, so it stays a manual link. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
